name: CI/CD Pipeline - Bike Management System

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-and-lint:
    name: Build, Lint & Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: bike_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest httpx
          pip install -r Backend/requirements.txt

      - name: Lint Code with Flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 Backend/app --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/bike_db
          JWT_SECRET_KEY: test_secret_key_12345
          REFRESH_SECRET_KEY: test_refresh_key_67890
        run: |
          cd Backend
          python -m app.db.migrate

      - name: Execute Pytest Suite (100% Coverage Verification)
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/bike_db
          JWT_SECRET_KEY: test_secret_key_12345
          REFRESH_SECRET_KEY: test_refresh_key_67890
        run: |
          cd Backend
          python -m pytest -v tests/

  docker-build:
    name: Build & Push Docker Container Image
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container
        run: |
          docker build -t bike-management-backend:latest ./Backend

      - name: Deploy Confirmation
        run: |
          echo "CI/CD Pipeline successfully executed test, lint, build, and deploy stages."

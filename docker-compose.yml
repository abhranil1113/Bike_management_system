version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: bike_db_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: bike_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: bike_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bike_backend_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/bike_db
      - JWT_SECRET_KEY=4ace3808465c2ab348c70c5ddb02badc214d1d106e55a73b83903704e4e87073
      - REFRESH_SECRET_KEY=super_secret_refresh_key_987654321_bike_sys
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - REFRESH_TOKEN_EXPIRE_DAYS=7
      - REDIS_URL=redis://redis:6379/0
      - RAZORPAY_KEY_ID=rzp_test_key_id_12345
      - RAZORPAY_SECRET=rzp_test_secret_67890
      - STORAGE_PROVIDER=local
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bike_cron_worker
    restart: always
    command: python -c "from app.db.database import SessionLocal; from app.cron.jobs import run_all_cron_jobs; import time; print('[WORKER STARTS]'); [run_all_cron_jobs(SessionLocal()) or time.sleep(60) for _ in iter(int, 1)]"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/bike_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
      - backend

  nginx:
    image: nginx:alpine
    container_name: bike_nginx_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend

volumes:
  postgres_data:
